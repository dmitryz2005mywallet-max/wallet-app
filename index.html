<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Кошелёк"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="apple-touch-icon.png"><script>try{var t=localStorage.getItem("mywallet.theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style><script>if("serviceWorker"in navigator&&/^https:|^http:\/\/localhost/.test(location.href))addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})</script><script src="firebase-config.js?v=4"></script></head><body>
<title>Мой кошелёк</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout concept: one phone-width column. White canvas, black and violet hero cards, lavender soft panels,
   pill tabs, floating pill navigation, big numpad for entry. Everything else is quiet. */
:root{
  --font:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --bg:#ffffff;--stage:#eceef8;--surface:#f5f5fb;--surface2:#ebebf6;--line:#e5e5f1;
  --ink:#0f0f18;--mute:#767a90;--faint:#a9acc0;
  --accent:#6a4cf5;--accent2:#8b6dff;--soft:#eeeafe;
  --dark:#0d0d14;--dark2:#241a4d;
  --pos:#12a150;--pos-bg:#e2f6ea;--neg:#e5484d;--neg-bg:#fdeaeb;--warn:#d98200;--warn-bg:#fdf0d8;
  --shadow:0 12px 32px rgba(30,20,90,.12);--scrim:rgba(14,12,30,.45);
  --r-card:24px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e0e15;--stage:#08080c;--surface:#17171f;--surface2:#20202b;--line:#272734;
  --ink:#f3f3f9;--mute:#9a9db2;--faint:#62647a;
  --accent:#7d60ff;--accent2:#9a82ff;--soft:#241f40;--dark:#050509;--dark2:#1d1640;
  --pos:#3ddc84;--pos-bg:#12281d;--neg:#ff6b70;--neg-bg:#2e171a;--warn:#f5a524;--warn-bg:#2e2412;
  --shadow:0 12px 32px rgba(0,0,0,.5);--scrim:rgba(0,0,0,.62);color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0e0e15;--stage:#08080c;--surface:#17171f;--surface2:#20202b;--line:#272734;
  --ink:#f3f3f9;--mute:#9a9db2;--faint:#62647a;
  --accent:#7d60ff;--accent2:#9a82ff;--soft:#241f40;--dark:#050509;--dark2:#1d1640;
  --pos:#3ddc84;--pos-bg:#12281d;--neg:#ff6b70;--neg-bg:#2e171a;--warn:#f5a524;--warn-bg:#2e2412;
  --shadow:0 12px 32px rgba(0,0,0,.5);--scrim:rgba(0,0,0,.62);color-scheme:dark;}

*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}
html{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:500 14px/1.4 var(--font);overflow:hidden;
  -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:inherit;-webkit-appearance:none;appearance:none}
input,textarea,select{font:inherit;font-size:16px;color:inherit}
svg{display:block;flex:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.stage{height:100%;display:flex;justify-content:center}
.app{position:relative;height:100%;width:100%;max-width:480px;background:var(--bg);overflow:hidden}
@media (min-width:640px){
  body{background:var(--stage)}
  .stage{padding:20px 0}
  .app{border-radius:36px;box-shadow:var(--shadow);border:1px solid var(--line)}
}
.scr{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;scrollbar-width:none}
.scr::-webkit-scrollbar{display:none}
#main{padding-bottom:132px}
.pg{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.page{position:absolute;inset:0;z-index:40;background:var(--bg);overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;scrollbar-width:none;padding-bottom:40px;animation:slide .26s cubic-bezier(.2,.8,.2,1)}
.page::-webkit-scrollbar{display:none}
@keyframes slide{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes down{to{transform:translateY(60px);opacity:0}}

/* header */
.hd{display:flex;align-items:center;gap:10px;padding-block:16px 6px}
.hd .hg{flex:1;min-width:0}
.hd h1{margin:0;font-size:24px;font-weight:800;letter-spacing:-.025em;flex:1}
.hi{font-weight:800;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mut{color:var(--mute);font-size:12.5px}
.av{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--accent2),var(--accent));color:#fff;font-weight:800;display:grid;place-items:center;font-size:16px;flex:none;text-align:center}
.av.big{width:84px;height:84px;font-size:30px}
.ib{width:42px;height:42px;border-radius:50%;background:var(--surface);display:grid;place-items:center;color:var(--ink);flex:none;position:relative}
.ib:active{transform:scale(.94)}
.ib.sm{width:34px;height:34px}
.ib .dot{position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--accent);border:2px solid var(--surface)}


/* common */
.col{display:flex;flex-direction:column;gap:22px}
.card{background:var(--surface);border-radius:var(--r-card);padding:16px}
.card.dark{background:radial-gradient(130% 130% at 100% 0%,var(--dark2) 0%,var(--dark) 58%);color:#fff}
.card.acc{background:linear-gradient(140deg,var(--accent2),var(--accent));color:#fff}
.card.soft{background:var(--soft)}
.sh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.sh h2{margin:0;font-size:17px;font-weight:800;letter-spacing:-.01em}
.lnk{color:var(--accent);font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:2px;white-space:nowrap}
.lbl{font-size:12px;color:var(--mute);font-weight:700;letter-spacing:.02em}
.w{color:rgba(255,255,255,.66)}
.bal{font-size:44px;line-height:1.05;font-weight:800;letter-spacing:-.035em;display:flex;align-items:baseline;flex-wrap:wrap}
.bal .c,.bal .d{color:var(--faint);font-weight:700}
.bal .c{font-size:.6em;margin-inline:4px}
.bal .d{font-size:.6em}
.card.dark .bal .c,.card.dark .bal .d{color:rgba(255,255,255,.45)}
.chip-d{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:800;padding:4px 10px;border-radius:99px;background:var(--pos-bg);color:var(--pos)}
.chip-d.neg{background:var(--neg-bg);color:var(--neg)}
.chip-d.warn{background:var(--warn-bg);color:var(--warn)}
.chip-d.glass{background:rgba(255,255,255,.16);color:#fff}
.balblk{display:flex;flex-direction:column;gap:6px;padding-block:8px 4px;align-items:flex-start}
.btn{height:54px;border-radius:18px;background:var(--accent);color:#fff;font-weight:800;font-size:15px;width:100%;display:flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn:active{transform:scale(.985)}
.btn[disabled],.btn.dis{opacity:.45;pointer-events:none}
.btn.ghost{background:var(--surface);color:var(--ink)}
.btn.soft{background:var(--soft);color:var(--accent)}
.btn.danger{background:var(--neg-bg);color:var(--neg)}
.btn.sm{height:40px;border-radius:14px;width:auto;padding:0 16px;font-size:13.5px}
.btn.dk{background:var(--ink);color:var(--bg)}
.card.dark .bal{font-size:38px}
.seg{display:flex;background:var(--surface);border-radius:18px;padding:4px;gap:2px}
.seg button{flex:1;min-width:0;height:40px;border-radius:14px;font-weight:700;color:var(--mute);text-align:center;display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.seg button.on{background:var(--accent);color:#fff}
.seg.sm button{height:34px;font-size:13px}
.hs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.hs::-webkit-scrollbar{display:none}
.chip{height:38px;padding:0 14px;border-radius:13px;background:var(--surface);font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:8px;white-space:nowrap;border:1.5px solid transparent;flex:none;position:relative}
.chip.on{background:var(--soft);border-color:var(--accent);color:var(--accent)}
.chip input[type=date]{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:0}
.tile{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;flex:none}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--surface);border-radius:20px;width:100%;text-align:left}
.row .m{flex:1;min-width:0}
.row .t{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{color:var(--mute);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .r{text-align:right;flex:none}
.amt{font-weight:800;font-size:15px;white-space:nowrap}
.amt.pos{color:var(--pos)}.amt.neg{color:var(--neg)}.amt.acc{color:var(--accent)}
.list{display:flex;flex-direction:column;gap:8px}
.dayh{display:flex;justify-content:space-between;align-items:baseline;padding:14px 2px 8px;color:var(--mute);font-weight:700;font-size:13px}
.dayh:first-child{padding-top:4px}
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden;position:relative}
.bar i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.bar i.warn{background:var(--warn)}.bar i.over{background:var(--neg)}.bar i.good{background:var(--pos)}
.bar.pace{overflow:visible}
.bar.pace b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.45;border-radius:2px}
.inp{height:54px;border-radius:16px;background:var(--surface);border:1.5px solid transparent;padding:0 16px;width:100%;outline:none;font-weight:600}
.inp:focus{border-color:var(--accent)}
.inp::placeholder{color:var(--faint);font-weight:500}
.fld{display:flex;flex-direction:column;gap:6px}
.fld>label,.fld>.lbl{padding-left:2px}
.empty{text-align:center;color:var(--mute);padding:26px 16px;display:flex;flex-direction:column;align-items:center;gap:10px}
.empty .ei{width:56px;height:56px;border-radius:50%;background:var(--soft);color:var(--accent);display:grid;place-items:center}
.empty b{color:var(--ink);font-size:15px}

/* home */
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fc{display:flex;flex-direction:column;gap:6px;align-items:flex-start;min-width:0;padding:16px 14px;text-align:left}
.fc .fi{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.16);display:grid;place-items:center;margin-bottom:6px}
.fc .fv{font-size:21px;font-weight:800;letter-spacing:-.02em;white-space:nowrap}
.crow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:4px 0}
.crow .cm{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.crow .cl{display:flex;justify-content:space-between;gap:8px;font-weight:700}
.crow .cl span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.crumbs{display:flex;gap:2px;align-items:center;flex-wrap:wrap;color:var(--mute);font-weight:700;font-size:13px;margin-bottom:4px}
.crumbs button{padding:4px 6px;border-radius:8px}
.crumbs button.cur{color:var(--ink)}

/* profile / settings */
.mrow{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--surface);border-radius:20px;width:100%;text-align:left}
.mrow .t{flex:1;font-weight:700;font-size:15px}
.mrow .tile{width:40px;height:40px;border-radius:13px}
.trow{display:flex;align-items:center;gap:4px;padding-left:calc(var(--d,0)*14px)}
.trow .tg{width:24px;height:36px;display:grid;place-items:center;color:var(--mute);flex:none;transition:transform .15s}
.trow .tg.o{transform:rotate(90deg)}
.trow .trm{flex:1;min-width:0;display:flex;align-items:center;gap:10px;padding:8px 10px;background:var(--surface);border-radius:16px}
.trow .trm .tile{width:34px;height:34px;border-radius:11px}
.trow .tx{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:1px}
.trow .tn{font-weight:700;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow .tc{color:var(--mute);font-size:12px;white-space:nowrap}
.tree{display:flex;flex-direction:column;gap:6px}

/* sheets */
.lyr{position:absolute;inset:0;z-index:60;display:flex;flex-direction:column;justify-content:flex-end}
.scrim{position:absolute;inset:0;background:var(--scrim);animation:fade .2s}
.sheet{position:relative;background:var(--bg);border-radius:28px 28px 0 0;max-height:92%;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;animation:up .28s cubic-bezier(.2,.8,.2,1);padding-bottom:22px;scrollbar-width:none}
.sheet::-webkit-scrollbar{display:none}
.sheet.full{height:96%;max-height:96%;display:flex;flex-direction:column}
.lyr.out .sheet{animation:down .2s ease-in forwards}
.lyr.out .scrim{opacity:0;transition:opacity .2s}
.grab{width:40px;height:4px;border-radius:9px;background:var(--line);margin:8px auto 0}
.shd{display:flex;align-items:center;gap:10px;padding-block:14px 10px}
.shd h3{margin:0;font-size:19px;font-weight:800;letter-spacing:-.02em;flex:1}
.sbody{display:flex;flex-direction:column;gap:16px;padding-block:6px}
.amtwrap{display:flex;flex-direction:column;align-items:center;gap:2px;padding-block:6px 14px;text-align:center}
.amtd{font-size:56px;font-weight:800;letter-spacing:-.04em;line-height:1.1;display:flex;align-items:baseline;justify-content:center;gap:6px;max-width:100%;flex-wrap:wrap}
.amtd.m{font-size:40px}.amtd.s{font-size:30px}
.amtd .cu{font-size:.45em;color:var(--faint);font-weight:700}
.amtd.neg{color:var(--ink)}.amtd.pos{color:var(--pos)}
.amts{color:var(--mute);font-weight:700;min-height:20px}
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.pad button{height:58px;border-radius:20px;background:var(--surface);font-size:24px;font-weight:700;display:grid;place-items:center;text-align:center}
.pad button:active{background:var(--surface2);transform:scale(.97)}
.pad .op{background:var(--soft);color:var(--accent)}
.pad .bk{background:var(--accent);color:#fff}
.sfoot{margin-top:auto;padding-block:12px 0}
.pick{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:18px;padding:12px 14px;width:100%;text-align:left;min-height:64px}
.pick .m{flex:1;min-width:0}
.pick .t{font-weight:800;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pick .s{color:var(--mute);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pick.ph .t{color:var(--accent)}
.cprow{display:flex;gap:8px;align-items:stretch}
.cprow .row{flex:1;min-width:0;padding:10px 12px}
.cprow .go{width:46px;border-radius:16px;background:var(--surface);display:grid;place-items:center;color:var(--mute);flex:none}
.kv{display:flex;justify-content:space-between;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:0}
.kv span:first-child{color:var(--mute);flex:none}
.kv span:last-child{font-weight:700;text-align:right;min-width: 0;overflow-wrap:anywhere}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.acts .btn{height:48px;font-size:13.5px;padding:0 6px}
textarea.inp{height:150px;padding:14px 16px;resize:none;font-weight:500;font-size:16px;font-family:ui-monospace,Menlo,Consolas,monospace}
.toast{position:absolute;left:50%;transform:translateX(-50%);bottom:92px;z-index:80;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:16px;font-weight:700;display:flex;gap:14px;align-items:center;max-width:calc(100% - 32px);box-shadow:var(--shadow);animation:up .25s}
.toast button{color:var(--accent2);font-weight:800;white-space:nowrap}
.hint{color:var(--mute);font-size:12.5px}
.sp{height:4px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
/* ===== simplified ===== */
#main{padding-bottom:110px}
.hd{padding-block:14px 2px}
.mnav{flex:1;display:flex;align-items:center;gap:8px;min-width:0}
.mlab{font-size:22px;font-weight:800;letter-spacing:-.025em;white-space:nowrap}
.fab{position:absolute;left:50%;transform:translateX(-50%);bottom:22px;z-index:30;height:56px;padding:0 26px 0 20px;border-radius:999px;background:var(--ink);color:var(--bg);font-weight:800;font-size:16px;display:flex;align-items:center;gap:10px;box-shadow:var(--shadow);white-space:nowrap}
.fab:active{transform:translateX(-50%) scale(.97)}
.fc{width:100%}
.fc.act{outline:3px solid var(--accent2);outline-offset:2px}
.card .crow{padding:7px 0}
.stack{display:flex;height:12px;gap:3px;margin-bottom:10px}
.stack i{display:block;height:100%;min-width:4px;border-radius:99px}
.chip-x{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px 0 12px;border-radius:99px;background:var(--soft);color:var(--accent);font-weight:800;font-size:12.5px}
.pad{grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(4,minmax(42px,1fr));gap:8px;flex:1 1 auto;min-height:192px;max-height:340px}
.pad button{height:auto;min-height:42px;border-radius:16px;font-size:22px}
.pad .bk{background:var(--soft);color:var(--accent)}
.amtwrap{padding-block:0 2px}
.amtd{font-size:48px}
.amtd.m{font-size:38px}.amtd.s{font-size:30px}
.sbody.add{gap:10px}
.two{display:grid;grid-template-columns:1.5fr 1fr;gap:8px}
.two .pick{min-height:56px;padding:9px 12px;gap:10px}
.pick{position:relative}
.pick input[type=date]{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:0}
.note{height:46px}
.mrow.danger .t{color:var(--neg)}
.mrow.danger .tile{background:var(--neg-bg)!important;color:var(--neg)!important}
.sfoot{position:sticky;bottom:0;background:var(--bg);padding-block:8px 2px;z-index:2}
@media (max-height:700px){.pad{min-height:184px}.pad button{font-size:20px}.amtd{font-size:38px}.sbody.add{gap:8px}}
@media (max-height:640px){.sbody.add>.hs{display:none}.pad{min-height:168px}.pad button{min-height:36px;font-size:18px}.sbody.add .btn{height:48px}.amtd{font-size:34px}.amtd.m{font-size:30px}.amtd.s{font-size:26px}.sbody.add .seg button{height:34px}.note{height:40px}.two .pick{min-height:48px}.shd{padding-block:6px 2px}}
/* ===== monthly limit + quick subcategory bar ===== */
[hidden]{display:none!important}
.ell{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lim{display:flex;flex-direction:column;gap:10px;width:100%;text-align:left}
.lim .lh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.lim .lv{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.lim .lv b{font-size:26px;font-weight:800;letter-spacing:-.02em;white-space:nowrap}
.lim .lv b.neg{color:var(--neg)}
.lim .lv .mut{color:var(--mute);font-weight:600}
.lim .lf{display:flex;justify-content:space-between;gap:4px 12px;flex-wrap:wrap;color:var(--mute);font-size:12.5px;font-weight:600}
.lim0{display:flex;align-items:center;gap:12px;width:100%;text-align:left}
.lim0 .lic{width:40px;height:40px;border-radius:13px;background:var(--bg);color:var(--accent);display:grid;place-items:center;flex:none}
.lim0 .lt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.lim0 .lt b{font-size:15px;font-weight:800}
.limin{display:flex;align-items:center;gap:10px}
.limin .inp{height:64px;font-size:28px;font-weight:800;letter-spacing:-.02em}
.limin .cu{font-size:24px;font-weight:800;color:var(--mute);flex:none}
.page.qa{padding-bottom:0}

function buildCats(){
  const out=[];
  function add(type,pid,node,idx,pcol){
    const col=pid?PALETTE[(Math.max(0,PALETTE.indexOf(pcol))+1+idx)%PALETTE.length]:PALETTE[(idx+(type==='income'?4:0))%PALETTE.length];
    const c={id:uid(),parentId:pid,type,name:node[0],icon:node[1],color:col};out.push(c);
    (node[2]||[]).forEach((k,i)=>add(type,c.id,k,i,col));
  }
  TREE_EXP.forEach((n,i)=>add('expense',null,n,i));TREE_INC.forEach((n,i)=>add('income',null,n,i));
  return out;
}
const FREQ={week:'каждую неделю',month:'каждый месяц',year:'каждый год'};
const REPS={none:'Нет',week:'Неделя',month:'Месяц',year:'Год'};

function norm(o){
  const n={v:2,cur:'PLN',conv:o.conv===''?'':(CONVS.indexOf(o.conv)>=0?o.conv:'UAH'),limit:Number.isFinite(o.limit)&&o.limit>0&&o.limit<=1e12?Math.round(o.limit):0};
  n.cats=(Array.isArray(o.cats)?o.cats:[]).filter(c=>c&&c.id&&c.name&&(c.type==='expense'||c.type==='income')).map(c=>({id:String(c.id),parentId:c.parentId||null,type:c.type,name:String(c.name),icon:c.icon||'tag',color:c.color||PALETTE[0]}));
  n.tx=(Array.isArray(o.tx)?o.tx:[]).filter(t=>t&&(t.type==='expense'||t.type==='income')&&Number.isFinite(t.amount)&&/^\d{4}-\d\d-\d\d$/.test(t.date)).map(t=>Object.assign({id:t.id?String(t.id):uid(),type:t.type,amount:Math.round(t.amount),categoryId:t.categoryId||null,date:t.date,note:String(t.note||''),createdAt:t.createdAt||Date.now(),updatedAt:t.updatedAt||0},t.recId?{recId:String(t.recId)}:{}));
  n.rec=(Array.isArray(o.rec)?o.rec:[]).filter(r=>r&&r.id&&(r.type==='expense'||r.type==='income')&&Number.isFinite(r.amount)&&r.amount>0&&FREQ[r.freq]&&/^\d{4}-\d\d-\d\d$/.test(r.start)).map(r=>({id:String(r.id),type:r.type,amount:Math.round(r.amount),categoryId:r.categoryId||null,note:String(r.note||''),freq:r.freq,start:r.start,day:+r.start.slice(8),n:Math.max(1,r.n|0),createdAt:r.createdAt||Date.now()}));
  if(!n.cats.length)n.cats=buildCats();
  return n;
}

/* ================= categories ================= */
let CM=new Map(),CH=new Map(),SUB=new Map();
function rebuild(){
  CM=new Map();CH=new Map();SUB=new Map();
  D.cats.forEach(c=>CM.set(c.id,c));
  D.cats.forEach(c=>{const k=c.parentId&&CM.has(c.parentId)?c.parentId:'root:'+c.type;if(!CH.has(k))CH.set(k,[]);CH.get(k).push(c);});
}
const kidsOf=id=>CH.get(id)||[];
const roots=type=>CH.get('root:'+type)||[];
function subtree(id){let s=SUB.get(id);if(s)return s;s=new Set([id]);for(const k of kidsOf(id))for(const x of subtree(k.id))s.add(x);SUB.set(id,s);return s;}
const NOCAT={id:'',name:'Без категории',icon:'tag',color:'#94a3b8'};
const catInfo=id=>CM.get(id)||NOCAT;
function catPath(id){const out=[];let c=CM.get(id),g=0;while(c&&g++<80){out.unshift(c);c=c.parentId?CM.get(c.parentId):null;}return out;}
const catLabel=id=>{const p=catPath(id);return p.length?p.map(c=>c.name).join(' › '):'Без категории';};
const parentLabel=id=>catPath(id).slice(0,-1).map(c=>c.name).join(' › ');
function createCat(type,parentId,name){
  const par=parentId?CM.get(parentId):null;
  const sib=parentId?kidsOf(parentId).length:roots(type).length;
  const c={id:uid(),parentId:parentId||null,type,name:name.trim(),icon:par?par.icon:'tag',color:par?PALETTE[(Math.max(0,PALETTE.indexOf(par.color))+1+sib)%PALETTE.length]:PALETTE[(sib+(type==='income'?4:0))%PALETTE.length]};
  D.cats.push(c);rebuild();return c;
}
/* deleting a category removes its subcategories; their operations move up to the parent */
function deleteCat(id){
  const c=CM.get(id);if(!c)return;const gone=subtree(id),dest=c.parentId||null;
  D.tx.forEach(t=>{if(gone.has(t.categoryId))t.categoryId=dest;});D.rec.forEach(r=>{if(gone.has(r.categoryId))r.categoryId=dest;});
  D.cats=D.cats.filter(x=>!gone.has(x.id));rebuild();
}
const usage=id=>{const s=subtree(id);let n=0;for(const t of D.tx)if(s.has(t.categoryId))n++;return n;};

/* ================= recurring operations =================
   A rule {freq,start,day,n} says: occurrence i happens on recDate(rule,i). Occurrences 0..n-1 already exist as
   normal operations (recId points back to the rule); applyRecurring() creates every one that is due up to today,
   so the data never holds future operations. Deleting a created operation does not bring it back. */
const RM=id=>D.rec.find(r=>r.id===id);
function recDate(r,i){
  if(r.freq==='week')return addDays(r.start,7*i);
  const s0=fromISO(r.start),m0=s0.getMonth()+(r.freq==='year'?12:1)*i,y=s0.getFullYear()+Math.floor(m0/12),m=((m0%12)+12)%12;
  return y+'-'+pad(m+1)+'-'+pad(Math.min(r.day,daysIn(y,m+1)));
}
function applyRecurring(){
  const today=todayISO();let made=0;
  for(const r of D.rec){
    for(let g=0;g<800;g++){
      const d=recDate(r,r.n);if(d>today)break;
      D.tx.push({id:r.id+'~'+r.n,type:r.type,amount:r.amount,categoryId:r.categoryId,date:d,note:r.note,createdAt:Date.now(),updatedAt:0,recId:r.id});r.n++;made++;
    }
  }
  return made;
}
const mkRule=(d,v,note)=>({id:uid(),type:d.type,amount:v,categoryId:d.cat,note:note,freq:d.rep,start:d.date,day:+d.date.slice(8),n:1,createdAt:Date.now()});

/* ================= calculations ================= */
function monthRange(off){
  const n=new Date(),d=new Date(n.getFullYear(),n.getMonth()+off,1,12),y=d.getFullYear(),m=d.getMonth();
  return {from:y+'-'+pad(m+1)+'-01',to:y+'-'+pad(m+1)+'-'+pad(daysIn(y,m+1)),label:MONTHS[m]+(y!==n.getFullYear()?' '+y:'')};
}
function offOf(iso){const n=new Date(),d=fromISO(iso);return (d.getFullYear()-n.getFullYear())*12+d.getMonth()-n.getMonth();}
const sum=(list,type)=>{let s=0;for(const t of list)if(t.type===type)s+=t.amount;return s;};
const balance=()=>D.tx.reduce((s,t)=>s+(t.type==='income'?t.amount:-t.amount),0);
function slices(L,type,node){
  const res=[];
  (node?kidsOf(node):roots(type)).forEach(k=>{const st=subtree(k.id);let v=0;for(const t of L)if(st.has(t.categoryId))v+=t.amount;if(v>0)res.push({id:k.id,name:k.name,icon:k.icon,color:k.color,value:v,deep:kidsOf(k.id).length>0});});
  let own=0;
  if(node){for(const t of L)if(t.categoryId===node)own+=t.amount;if(own>0)res.push({id:'__own',name:'Без подкатегории',icon:CM.get(node).icon,color:CM.get(node).color,value:own,deep:false});}
  else{for(const t of L)if(!CM.has(t.categoryId))own+=t.amount;if(own>0)res.push({id:'__none',name:'Без категории',icon:'tag',color:'#94a3b8',value:own,deep:false});}
  return res.sort((a,b)=>b.value-a.value);
}
function recentCats(type){
  const m=new Map();let n=0;
  for(let i=D.tx.length-1;i>=0&&n<200;i--){const t=D.tx[i];if(t.type!==type||!CM.has(t.categoryId))continue;m.set(t.categoryId,(m.get(t.categoryId)||0)+1);n++;}
  return Array.from(m.entries()).sort((a,b)=>b[1]-a[1]).slice(0,5).map(x=>x[0]);
}

function donut(sl,total,label){

  const type=curType(),inc=type==='income',r=monthRange(UI.off),node=curNode();

  let h='<div class="pg col" style="gap:16px"><header class="hd"><button class="ib" data-a="bk" aria-label="Назад">'+ico('back',20)+'</button>'

/* monthly spending limit: one amount that applies to every month */
function limitWidget(exp){
  const lim=D.limit||0;
  if(!lim)return '<button class="card soft lim0" data-a="limit"><span class="lic">'+ico('target',20)+'</span><span class="lt"><b>Лимит трат на месяц</b><span class="hint">Задайте сумму — покажу, сколько осталось</span></span><span class="chip-x">Задать</span></button>';
  const left=lim-exp,over=left<0,pct=exp/lim,cur=UI.off===0;
  const cls=over?'over':pct>=.8?'warn':'good';
  let perDay='';
  if(cur&&!over){const n=new Date(),dl=daysIn(n.getFullYear(),n.getMonth()+1)-n.getDate()+1;perDay='≈ '+money(Math.round(left/dl),{dec:0})+' в день';}
  else if(!cur)perDay=over?'Лимит превышен':'Уложились в лимит';
  const n2=new Date(),mark=cur?'<b style="left:'+(n2.getDate()/daysIn(n2.getFullYear(),n2.getMonth()+1)*100).toFixed(1)+'%" title="Где вы должны быть к сегодняшнему дню"></b>':'';
  return '<button class="card lim" data-a="limit" aria-label="Лимит трат на месяц, изменить">'
    +'<span class="lh"><span class="lbl">Лимит на месяц</span><span class="chip-d'+(over?' neg':pct>=.8?' warn':'')+'">'+(over?'Превышен':Math.round(pct*100)+'%')+'</span></span>'
    +'<span class="lv"><b'+(over?' class="neg"':'')+'>'+money(left,{dec:0})+'</b><span class="mut">'+(over?'сверх лимита':'осталось')+'</span></span>'
    +'<span class="bar pace"><i class="'+cls+'" style="width:'+Math.min(100,Math.max(exp>0?2:0,pct*100)).toFixed(1)+'%"></i>'+mark+'</span>'
    +'<span class="lf"><span>Потрачено '+money(exp,{dec:0})+' из '+money(lim,{dec:0})+'</span>'+(perDay?'<span>'+perDay+'</span>':'')+'</span></button>';

function syErr(e){

  if(c==='auth/unauthorized-domain')return 'Адрес сайта не добавлен в Firebase: Authentication → Settings → Authorized domains.';
  if(c==='auth/operation-not-allowed')return 'В Firebase не включён вход через Google (Authentication → Sign-in method).';
  if(c==='auth/network-request-failed'||c==='unavailable'||/offline|network/i.test(m))return 'Нет связи с сервером. Изменения сохранены на устройстве и отправятся позже.';
  if(c==='permission-denied')return 'Нет доступа к базе: проверьте правила Firestore (файл firestore.rules).';
  if(c==='not-found'||c==='failed-precondition'||/has not been used|does not exist/i.test(m))return 'В проекте Firebase не создана база Firestore.';
  if(c==='resource-exhausted'||m==='too-big')return 'Данных слишком много для облака (лимит документа 1 МБ).';

const syCatSig=cs=>{const m=new Map(cs.map(c=>[c.id,c]));return cs.map(c=>{const p=c.parentId&&m.get(c.parentId);return c.type+'|'+(p?p.name:'')+'|'+c.name+'|'+c.icon+'|'+c.color;}).sort().join('\n');};

function syRemap(loc,rem){
  const path=(m,c)=>{const o=[];let x=c,g=0;while(x&&g++<50){o.unshift(x.name);x=x.parentId?m.get(x.parentId):null;}return c.type+'|'+o.join('/');};

    cats:rem.cats.filter(c=>!idm.has(c.id)).map(c=>Object.assign({},c,{parentId:f(c.parentId)})),

function syList(b,l,r,pick){

async function syStep(){

    const s=await tx.get(ref),cur=s.exists()?(+s.data().rev||0):0;

  tx(el){openSheet('txd',{id:el.dataset.id});},
  'tx-edit'(el){const s=sheetOf(el);const t=D.tx.find(x=>x.id===s.data.id);closeSheetObj(s,true);if(t)openEdit(t);},
  'tx-del'(el){const s=sheetOf(el);const id=s.data.id;closeSheetObj(s);withUndo('Операция удалена',()=>{D.tx=D.tx.filter(x=>x.id!==id);});},
  menu(){openSheet('menu',{});},
  'm-recs'(el){const s=sheetOf(el);closeSheetObj(s,true);openSheet('recs',{});},
  'rec-new'(el){const s=sheetOf(el);closeSheetObj(s,true);openAdd('month');},
  'rec-open'(el){if(RM(el.dataset.id))openSheet('rec',{id:el.dataset.id});},
  'rec-edit'(el){const s=sheetOf(el),r=RM(s.data.id);closeSheetObj(s,true);if(r)openRec(r);},
  'rec-stop'(el){const s=sheetOf(el),id=s.data.id;closeSheetObj(s);withUndo('Повтор остановлен',()=>{D.rec=D.rec.filter(r=>r.id!==id);});},
  'rec-del'(el){const s=sheetOf(el),id=s.data.id,n=D.tx.reduce((k,t)=>k+(t.recId===id?1:0),0);closeSheetObj(s,true);confirmBox({title:'Удалить повтор и операции?',text:'Будет удалено правило повтора и все созданные им операции ('+n+').',ok:'Удалить',danger:true,cb:()=>withUndo('Повтор и операции удалены',()=>{D.rec=D.rec.filter(r=>r.id!==id);D.tx=D.tx.filter(t=>t.recId!==id);})});},
  'sheet-close'(el){const s=sheetOf(el)||topSheet();if(s)closeSheetObj(s);},
  undo(){if(UNDO){const f=UNDO;UNDO=null;$('#toast').hidden=true;f();}},
  'confirm-ok'(el){const s=sheetOf(el);const cb=s.data.cb;closeSheetObj(s);if(cb)cb();},
  'copybox-select'(el){const t=$('#cbx',sheetOf(el).el);if(t){t.focus();t.select();}},
  /* add sheet */
  key(el){const s=sheetOf(el);if(s)pressKey(s,el.dataset.k);},
  sf(el){const s=sheetOf(el);if(!s)return;setPath(s.data,el.dataset.f,el.dataset.v);paintSheet(s);},
  'add-type'(el){const s=sheetOf(el),d=s.data;d.type=el.dataset.v;if(d.cat&&CM.has(d.cat)&&CM.get(d.cat).type!==d.type)d.cat=null;paintSheet(s);},
  'add-save'(el){saveAdd(sheetOf(el));},
  'pick-cat'(el){const s=sheetOf(el);openPicker({type:s.data.type,cur:s.data.cat,title:s.data.type==='expense'?'Категория расхода':'Категория дохода',cb:id=>{s.data.cat=id;paintSheet(s);}});},
  /* picker */
  'cp-nav'(el){const s=sheetOf(el);s.data.node=el.dataset.id||null;s.data.q='';paintSheet(s);const n=s.data.node&&CM.has(s.data.node)?s.data.node:null;if(!(n?kidsOf(n):roots(s.data.type)).length){const i=$('#cpq',s.el);if(i)i.focus();}},
  'cp-pick'(el){const s=sheetOf(el);const id=el.dataset.id||null;const cb=s.data.cb;closeSheetObj(s);if(cb)cb(id);},
  'cp-go'(el){const s=sheetOf(el);if(!(s.data.q||'').trim()){const i=$('#cpq',s.el);if(i)i.focus();return;}cpCreate(s,s.data.q);},
  /* categories page */
  'm-cats'(el){const s=sheetOf(el);closeSheetObj(s,true);UI.page='cats';render();},
  pop(){UI.page=null;render();},
  ctype(el){UI.cType=el.dataset.v;if(UI.qa)UI.qa.parent=null;render();},
  cexp(el){const id=el.dataset.id;if(UI.cexp.has(id))UI.cexp.delete(id);else UI.cexp.add(id);render();},
  catedit(el){const c=CM.get(el.dataset.id);if(c)openSheet('catedit',{id:c.id,type:c.type,parent:c.parentId||null,name:c.name,icon:c.icon,color:c.color});},
  'ce-ico'(el){const s=sheetOf(el);s.data.icon=el.dataset.v;cePaint(s);},
  'ce-col'(el){const s=sheetOf(el);s.data.color=el.dataset.v;cePaint(s);},
  catadd(el){const id=el.dataset.id||null;if(id)UI.cexp.add(id);const was=!!UI.qa;UI.qa={parent:id};render();if(!was)qmsg('');qaFocus();},
  'qa-add'(){qaSubmit();},
  'qa-close'(){UI.qa=null;render();},
  'cat-save'(el){
    const s=sheetOf(el),d=s.data;const nm=d.name.trim();if(!nm){toast('Введите название');return;}
    const cc=CM.get(d.id);cc.name=nm;cc.icon=ICONS[d.icon]?d.icon:cc.icon;cc.color=/^#[0-9a-fA-F]{6}$/.test(d.color)?d.color:cc.color;commit();closeSheetObj(s);toast('Сохранено');
  },
  'cat-sub'(el){const s=sheetOf(el);const id=s.data.id;closeSheetObj(s,true);UI.cexp.add(id);UI.qa={parent:id};render();qmsg('');qaFocus();},
  limit(){openLimit();},
  'limit-fill'(el){const s=sheetOf(el);s.data.amt=el.dataset.v;paintSheet(s);const i=$('#limv',s.el);if(i)i.focus();},
  'limit-save'(el){
    const s=sheetOf(el),v=parseMoney(s.data.amt);
    if(!(v>0&&v<=1e12)){toast('Введите сумму лимита');return;}
    D.limit=v;commit();closeSheetObj(s);toast('Лимит установлен');
  },
  'limit-clear'(el){const s=sheetOf(el);closeSheetObj(s);withUndo('Лимит убран',()=>{D.limit=0;});},
  'cat-del'(el){
    const s=sheetOf(el);const id=s.data.id,c=CM.get(id);if(!c)return;closeSheetObj(s,true);
    const kids=subtree(id).size-1,n=usage(id),dest=c.parentId?CM.get(c.parentId).name:'Без категории';
    confirmBox({title:'Удалить «'+c.name+'»?',text:(kids?'Вместе с подкатегориями ('+kids+'). ':'')+(n?'Операции ('+n+') останутся и перейдут в «'+dest+'».':'Операций в ней нет.'),ok:'Удалить',danger:true,cb:()=>withUndo('Категория удалена',()=>deleteCat(id))});
  },
  /* menu */
  theme(){themeToggle();},
  'm-cur'(el){const s=sheetOf(el);closeSheetObj(s,true);openSheet('cur',{edit:false,rv:''});maybeFetchRates();},
  'cv-open'(){openSheet('cur',{edit:false,rv:''});maybeFetchRates();},
  'cv-pick'(el){const v=el.dataset.v||'';D.conv=v;save();FXST.err='';render();if(v)maybeFetchRates(!rateOf(v));},
  'cv-refresh'(){fetchRates();},
  'cv-reset'(){FX=null;try{localStorage.removeItem(FXKEY);}catch(e){}FXST.err='';render();fetchRates();},
  'cv-manual'(el){const s=sheetOf(el);s.data.edit=true;s.data.rv='';paintSheet(s);const i=$('#cvv',s.el);if(i)i.focus();},
  'cv-mcancel'(el){const s=sheetOf(el);s.data.edit=false;paintSheet(s);},
  'cv-msave'(el){
    const s=sheetOf(el),v=parseFloat(String(s.data.rv||'').replace(/\s/g,'').replace(',','.'));
    if(!(v>0&&v<1e6)){toast('Введите курс числом');return;}
    const r=D.conv==='UAH'?v:1/v;
    FX={ts:Date.now(),date:todayISO(),src:MANUAL,r:Object.assign({},FX&&FX.r,{[D.conv]:r})};fxSave();FXST.err='';
    s.data.edit=false;render();toast('Курс сохранён');
  },
  'm-install'(el){const s=sheetOf(el);if(INSTALL){const p=INSTALL;INSTALL=null;closeSheetObj(s,true);try{p.prompt();}catch(e){}return;}closeSheetObj(s,true);openSheet('install',{});},
  'm-sync'(el){const s=sheetOf(el);closeSheetObj(s,true);openSheet('sync',{});if(fbReady)syInit();},
  'sy-login'(){syLogin();},
  'sy-now'(){syncNow();},
  'sy-out'(el){const s=sheetOf(el);closeSheetObj(s,true);confirmBox({title:'Выйти из аккаунта?',text:'Данные сохранятся в облаке, а с этого устройства будут удалены. Чтобы пользоваться приложением, нужно будет войти снова.',ok:'Выйти',cb:()=>{syLogout();}});},
  'sy-retry'(){FBP=null;SY.state='idle';SY.err='';syInit();},
  'm-backup'(){saveFile('moi-koshelek-'+todayISO()+'.json',JSON.stringify(D));},
  'm-restore'(el){const s=sheetOf(el);closeSheetObj(s,true);openSheet('restore',{text:'',err:''});},
  'restore-go'(el){
    const s=sheetOf(el);const txt=(s.data.text||'').trim();if(!txt){s.data.err='Вставьте текст копии или выберите файл.';paintSheet(s);return;}
    let n=null;try{n=migrate(JSON.parse(txt));}catch(e){}
    if(!n){s.data.err='Это не похоже на резервную копию кошелька.';paintSheet(s);return;}
    D=n;applyRecurring();UI.page=null;UI.f='all';UI.cnode=null;UI.off=0;UI.sheets.slice().forEach(x=>closeSheetObj(x,true));commit();flush();toast('Данные восстановлены');
  },
  'm-wipe'(el){const s=sheetOf(el);closeSheetObj(s,true);confirmBox({title:'Удалить все данные?',text:'Все операции и свои категории будут удалены'+(SY.state==='in'?' на этом устройстве, в облаке и на всех синхронизированных устройствах':'')+'. Сначала лучше сохранить копию.',ok:'Удалить',danger:true,cb:()=>withUndo('Все данные удалены',()=>{const cur=D.cur,lim=D.limit;D=emptyData();D.cur=cur;D.limit=lim;UI.page=null;UI.f='all';UI.cnode=null;UI.off=0;})});}
};

/* ================= events ================= */
const appEl=$('#app');
appEl.addEventListener('click',e=>{
  const t=e.target;
  if(t.matches&&t.matches('input[type=date]')&&t.showPicker){try{t.showPicker();}catch(_){}}
  const el=t.closest?t.closest('[data-a]'):null;if(!el||!appEl.contains(el))return;
  const f=ACT[el.dataset.a];if(f)f(el,e);
});
/* the quick-add button must not steal focus from the input, or the phone keyboard would close after every name */
appEl.addEventListener('mousedown',e=>{if(e.target.closest&&e.target.closest('.qadd'))e.preventDefault();});
appEl.addEventListener('input',e=>{
  const el=e.target,ds=el.dataset||{};
  if(el.id==='qin'){qmsg('');return;}
  if(!ds.bind)return;
  const s=sheetOf(el);if(!s)return;setPath(s.data,ds.bind,el.value);
  if(ds.live==='ce'){cePaint(s);return;}
  if(ds.live==='cp'){const l=$('#cplist',s.el);if(l)l.innerHTML=catList(s.data);const b=$('.cpplus',s.el);if(b)b.classList.toggle('on',!!(s.data.q||'').trim());}
});
appEl.addEventListener('change',e=>{
  const el=e.target,ds=el.dataset||{};
  if(ds.file){const fl=el.files&&el.files[0];if(!fl)return;const s=sheetOf(el);const rd=new FileReader();rd.onload=()=>{s.data.text=String(rd.result||'');s.data.err='';paintSheet(s);};rd.onerror=()=>{s.data.err='Не удалось прочитать файл.';paintSheet(s);};rd.readAsText(fl);return;}
  if(ds.bind&&ds.rr){const s=sheetOf(el);if(!s)return;if(ds.bind==='date'&&!el.value)return;setPath(s.data,ds.bind,el.value||'');paintSheet(s);}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){const s=topSheet();if(s)closeSheetObj(s);else if(UI.qa){UI.qa=null;render();}else if(UI.page==='break'&&curNode())ACT.bk();else if(UI.page){UI.page=null;render();}return;}
  const ae=document.activeElement,s=topSheet();
  if(e.key==='Enter'&&ae){
    if(ae.id==='qin'&&!s){qaSubmit();e.preventDefault();return;}
    if(ae.id==='cpq'&&s&&s.kind==='catpick'){ACT['cp-go'](s.el);e.preventDefault();return;}
    if(ae.id==='cvv'&&s&&s.kind==='cur'){ACT['cv-msave'](s.el);e.preventDefault();return;}
    if(ae.id==='limv'&&s&&s.kind==='limit'){ACT['limit-save'](s.el);e.preventDefault();return;}
  }
  if(!s||s.kind!=='add')return;
  const tag=ae&&ae.tagName;if(tag==='INPUT'||tag==='TEXTAREA')return;
  const k=e.key;
  if(/^[0-9]$/.test(k)){pressKey(s,k);e.preventDefault();}
  else if(k===','||k==='.'){pressKey(s,',');e.preventDefault();}
  else if(k==='Backspace'){pressKey(s,'bk');e.preventDefault();}
  else if(k==='Enter'){saveAdd(s);e.preventDefault();}
});
function dayTick(){const t=todayISO();if(t===lastDay)return;lastDay=t;if(applyRecurring())commit();else render();}
document.addEventListener('visibilitychange',()=>{if(!document.hidden){dayTick();maybeFetchRates();syncSoon();}});
setInterval(dayTick,60000);

/* ================= boot ================= */
STORE_OK=testStore();
D=load();const fresh=!D;if(fresh)D=emptyData();
themeApply();applyRecurring();rebuild();
$('#fab').innerHTML=ico('plus',22)+'<span>Добавить</span>';
if(STORE_OK)flush();
render();
maybeFetchRates();
if(fbReady)syInit();
window.__app={SY,get SM(){return SM;},syncNow,syMerge,syRemap,get D(){return D;},get FX(){return FX;},set FX(v){FX=v;},themeNow,sec,fetchRates,UI,ACT,render,commit,recDate,applyRecurring,money,balance,slices,monthRange,migrate,fresh};
})();
</script>
